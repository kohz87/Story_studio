name: Story Studio CI

on:
  pull_request:
  push:
    branches: [main, studio-2]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Check the whitespace of what this PR or push introduced; a bare `git diff --check`
      # on a fresh checkout compares a clean tree and never finds anything.
      - name: Diff check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE="$(git hash-object -t tree /dev/null)"
          fi
          git diff --check "$BASE" HEAD
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Syntax check
        run: npm run check
      - name: Behavioral tests
        run: npm test
      - name: Build distribution
        run: npm run build
      - name: Verify committed build artifact
        run: git diff --exit-code -- dist/story-studio.html src/assets/drawings.js
      - name: Built-file safety scan
        run: node --test tests/build.test.js
